appId: com.narrationprompter.prompter
productName: Prompter
executableName: Prompter
artifactName: ${productName}-Setup-${version}-${arch}.${ext}
directories:
  output: release
asar: true
files:
  - package.json
  - dist/**/*
  - dist-electron/**/*.js
  - dist-electron/**/*.cjs
  - dist-shared/**/*.js
  - node_modules/ws/**/*
  - node_modules/@homebridge/ciao/**/*
  - node_modules/ajv/**/*
  - node_modules/debug/**/*
  - node_modules/fast-deep-equal/**/*
  - node_modules/fast-uri/**/*
  - node_modules/json-schema-traverse/**/*
  - node_modules/require-from-string/**/*
  - node_modules/source-map-support/**/*
  - node_modules/source-map/**/*
  - node_modules/buffer-from/**/*
  - node_modules/ms/**/*
  - node_modules/tslib/**/*
  - node_modules/@napi-rs/canvas/**/*
  - node_modules/@napi-rs/canvas-win32-x64-msvc/**/*
  - node_modules/@xmldom/xmldom/**/*
  - node_modules/argparse/**/*
  - node_modules/base64-js/**/*
  - node_modules/bluebird/**/*
  - node_modules/core-util-is/**/*
  - node_modules/dingbat-to-unicode/**/*
  - node_modules/duck/**/*
  - node_modules/immediate/**/*
  - node_modules/inherits/**/*
  - node_modules/isarray/**/*
  - node_modules/js-tokens/**/*
  - node_modules/jszip/**/*
  - node_modules/lie/**/*
  - node_modules/loose-envify/**/*
  - node_modules/lop/**/*
  - node_modules/mammoth/**/*
  - node_modules/option/**/*
  - node_modules/pako/**/*
  - node_modules/path-is-absolute/**/*
  - node_modules/pdfjs-dist/**/*
  - node_modules/process-nextick-args/**/*
  - node_modules/react/**/*
  - node_modules/react-dom/**/*
  - node_modules/readable-stream/**/*
  - node_modules/safe-buffer/**/*
  - node_modules/scheduler/**/*
  - node_modules/setimmediate/**/*
  - node_modules/string_decoder/**/*
  - node_modules/underscore/**/*
  - node_modules/util-deprecate/**/*
  - node_modules/xmlbuilder/**/*
  - '!**/*.map'
  - '!**/*.ts'
  - '!**/*.tsx'
  - '!**/*.test.*'
  - '!**/test/**'
  - '!**/tests/**'
extraResources:
  - from: shared/protocol/schemas
    to: protocol-schemas
    filter:
      - '*.json'
  - from: build/whisper-sidecar/dist/whisper-sidecar
    to: whisper-sidecar
    filter:
      - '**/*'
  - from: build/models/base.en
    to: models/base.en
    filter:
      - '**/*'
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
win:
  target:
    - target: dir
      arch:
        - x64
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createStartMenuShortcut: true
  createDesktopShortcut: true
  shortcutName: Prompter
  uninstallDisplayName: Prompter
  deleteAppDataOnUninstall: false
  runAfterFinish: false
